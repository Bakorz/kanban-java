name: Application CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  schema:
    name: Verify isolated database schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check schema and restricted role without live credentials
        run: python3 database/verify-local.py
  foundation:
    name: Build and verify foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Test and build frontend
        run: npm test --prefix frontend && npm run build --prefix frontend
      - name: Check shipped dependency advisories
        run: npm audit --omit=dev --prefix frontend
      - name: Test and package backend
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Check browser states and mobile layout
        run: npm run test:e2e --prefix frontend
      - name: Verify real React to Servlet connection
        run: node scripts/verify-foundation.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-evidence
          path: |
            frontend/test-results/
            backend/target/surefire-reports/
          retention-days: 7
